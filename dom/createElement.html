<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
    content="width=device-width, initial-scale=1.0">
    <title>Creating Element</title>
</head>
<body style="background-color: black; color: wheat;">
    
</body>  
<script>
    // syntax for creating a new element & storing it in a container.
    const div = document.createElement('div')
    // for Printing the element
    console.log(div);
    // for giving the element a class name.
    div.className = "main"

    // Giving an id.
    div.id = Math.round(Math.random() * 10 + 1)


    div.style.backgroundColor = "yellow"
    div.style.color = "black"

    // Setting custom attributes.
    div.setAttribute("title", "title change")

    // For writing a text in that element.
    // .innerText is little bit inefficient, cause it first brings the content & then updates it.
    const addText = document.createTextNode("Hulk Smash")
    div.appendChild(addText)

    // Attaching the new element to the main tree.
    document.body.appendChild(div)

</script>
</html>
