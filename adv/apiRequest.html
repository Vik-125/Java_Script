<script>
    const requestURL = "https://api.github.com/users/Vik-125"
    const xhr = new XMLHttpRequest();
    xhr.open('GET',requestURL)

    // For checking the status of xhr , continuosly
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState)
        if(xhr.readyState === 4){
            // Now convert the api, from string to JSON.
            const currData = JSON.parse(this.responseText)
            console.log(currData)
            console.log(currData.id)
        }
    }

    // For sending the calls to the api.
    xhr.send()
</script>
</html>
